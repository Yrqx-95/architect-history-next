openapi: 3.1.0
info:
  title: Archistory Graduation Inspiration API
  version: 0.1.0
  summary: Static-first contract for the Graduation Inspiration Library submenu.
  description: >
    V1 is content-driven, no-login, and no-AI. The current implementation may
    read local JSON directly, but this contract defines the planned data surface
    for future static endpoints or server routes.
servers:
  - url: /
    description: Same-origin static site or app route base.
tags:
  - name: home
  - name: issues
  - name: site-types
  - name: cases
  - name: random
  - name: brief
  - name: export
paths:
  /api/home:
    get:
      tags: [home]
      summary: Graduation home aggregation.
      responses:
        "200":
          description: Home page content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"
  /api/issues:
    get:
      tags: [issues]
      summary: List social issues.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/TagQuery"
        - $ref: "#/components/parameters/SiteTypeQuery"
        - $ref: "#/components/parameters/BuildingTypeQuery"
        - $ref: "#/components/parameters/PageQuery"
      responses:
        "200":
          description: Issue list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"
  /api/issues/{id}:
    get:
      tags: [issues]
      summary: Get one social issue with related site types and cases.
      parameters:
        - $ref: "#/components/parameters/IssueIdPath"
      responses:
        "200":
          description: Issue detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/sites:
    get:
      tags: [site-types]
      summary: List site types.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/TagQuery"
        - $ref: "#/components/parameters/PageQuery"
      responses:
        "200":
          description: Site type list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteTypeListResponse"
  /api/sites/{id}:
    get:
      tags: [site-types]
      summary: Get one site type with related issues and cases.
      parameters:
        - $ref: "#/components/parameters/SiteTypeIdPath"
      responses:
        "200":
          description: Site type detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteTypeDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/cases:
    get:
      tags: [cases]
      summary: List architecture cases.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/TagQuery"
        - $ref: "#/components/parameters/PageQuery"
      responses:
        "200":
          description: Case list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListResponse"
  /api/cases/{id}:
    get:
      tags: [cases]
      summary: Get one architecture case.
      parameters:
        - $ref: "#/components/parameters/CaseIdPath"
      responses:
        "200":
          description: Case detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/random:
    post:
      tags: [random]
      summary: Generate one structured inspiration bundle.
      description: >
        This is not AI generation. It selects and combines existing published
        issue, site type, and case records from the structured content library.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RandomRequest"
      responses:
        "200":
          description: Random inspiration bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspirationBundle"
  /api/brief:
    get:
      tags: [brief]
      summary: Get structured teacher brief content.
      responses:
        "200":
          description: Teacher brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"
  /api/export/issues.csv:
    get:
      tags: [export]
      summary: Export issues as CSV.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/TagQuery"
        - $ref: "#/components/parameters/SiteTypeQuery"
        - $ref: "#/components/parameters/BuildingTypeQuery"
      responses:
        "200":
          description: CSV file.
          content:
            text/csv:
              schema:
                type: string
  /api/export/sites.csv:
    get:
      tags: [export]
      summary: Export site types as CSV.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/TagQuery"
      responses:
        "200":
          description: CSV file.
          content:
            text/csv:
              schema:
                type: string
  /api/export/cases.csv:
    get:
      tags: [export]
      summary: Export cases as CSV.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/TagQuery"
      responses:
        "200":
          description: CSV file.
          content:
            text/csv:
              schema:
                type: string
  /api/export/inspiration-bundle.json:
    post:
      tags: [export]
      summary: Export the current inspiration bundle as JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspirationBundle"
      responses:
        "200":
          description: JSON bundle file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspirationBundle"
components:
  parameters:
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Keyword search across title/name, summary/concept, and keywords.
    TagQuery:
      name: tag
      in: query
      required: false
      schema:
        type: string
      description: Keyword/tag filter.
    SiteTypeQuery:
      name: siteType
      in: query
      required: false
      schema:
        type: string
        pattern: "^SITE-[0-9]{3}$"
    BuildingTypeQuery:
      name: buildingType
      in: query
      required: false
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    IssueIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^ISSUE-[0-9]{3}$"
    SiteTypeIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^SITE-[0-9]{3}$"
    CaseIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^CASE-[0-9]{3}$"
  responses:
    NotFound:
      description: Requested record was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HomeResponse:
      type: object
      required: [featured_issues, featured_cases, popular_tags, updated_at]
      properties:
        featured_issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        featured_cases:
          type: array
          items:
            $ref: "#/components/schemas/Case"
        popular_tags:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date
    IssueListResponse:
      allOf:
        - $ref: "#/components/schemas/PagedResponse"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Issue"
    IssueDetailResponse:
      type: object
      required: [issue, related_site_types, related_cases]
      properties:
        issue:
          $ref: "#/components/schemas/Issue"
        related_site_types:
          type: array
          items:
            $ref: "#/components/schemas/SiteType"
        related_cases:
          type: array
          items:
            $ref: "#/components/schemas/Case"
    SiteTypeListResponse:
      allOf:
        - $ref: "#/components/schemas/PagedResponse"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SiteType"
    SiteTypeDetailResponse:
      type: object
      required: [site_type, related_issues, related_cases]
      properties:
        site_type:
          $ref: "#/components/schemas/SiteType"
        related_issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        related_cases:
          type: array
          items:
            $ref: "#/components/schemas/Case"
    CaseListResponse:
      allOf:
        - $ref: "#/components/schemas/PagedResponse"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Case"
    RandomRequest:
      type: object
      properties:
        tag:
          type: string
          nullable: true
        siteType:
          type: string
          nullable: true
          pattern: "^SITE-[0-9]{3}$"
        buildingType:
          type: string
          nullable: true
        seed:
          type: string
          nullable: true
    InspirationBundle:
      type: object
      required: [generated_title, issue, site_types, cases]
      properties:
        generated_title:
          type: string
        issue:
          $ref: "#/components/schemas/Issue"
        site_types:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/SiteType"
        cases:
          type: array
          minItems: 0
          maxItems: 3
          items:
            $ref: "#/components/schemas/Case"
        exported_at:
          type: string
          format: date-time
    Issue:
      type: object
      required:
        - id
        - title
        - summary
        - keywords
        - recommended_site_types
        - recommended_building_types
        - reference_case_ids
        - source_urls
        - status
      properties:
        id:
          type: string
          pattern: "^ISSUE-[0-9]{3}$"
        title:
          type: string
        summary:
          type: string
        keywords:
          type: array
          items:
            type: string
        recommended_site_types:
          type: array
          items:
            type: string
            pattern: "^SITE-[0-9]{3}$"
        recommended_building_types:
          type: array
          items:
            type: string
        reference_case_ids:
          type: array
          items:
            type: string
            pattern: "^CASE-[0-9]{3}$"
        case_relation_notes:
          type: object
          additionalProperties:
            type: string
        source_urls:
          type: array
          items:
            type: string
            format: uri
        status:
          $ref: "#/components/schemas/PublishStatus"
        updated_at:
          type: string
          format: date
    SiteType:
      type: object
      required: [id, name, address_example, fit_reason, map_url, keywords, status]
      properties:
        id:
          type: string
          pattern: "^SITE-[0-9]{3}$"
        name:
          type: string
        address_example:
          type: string
        fit_reason:
          type: string
        map_url:
          type: string
        keywords:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/PublishStatus"
    Case:
      type: object
      required:
        - id
        - name
        - location
        - image_url
        - plan_url
        - section_url
        - concept
        - keywords
        - source_url
        - status
      properties:
        id:
          type: string
          pattern: "^CASE-[0-9]{3}$"
        name:
          type: string
        location:
          type: string
        image_url:
          type: string
        image_source_url:
          type: string
          format: uri
        image_license:
          type: string
        image_credit:
          type: string
        image_note:
          type: string
        plan_url:
          type: string
        section_url:
          type: string
        concept:
          type: string
        keywords:
          type: array
          items:
            type: string
        source_url:
          type: string
          format: uri
        year:
          oneOf:
            - type: integer
            - type: "null"
            - type: string
              enum: [""]
        architect:
          type: string
        status:
          $ref: "#/components/schemas/PublishStatus"
    Brief:
      type: object
      description: Structured teacher brief. Exact section fields may follow current brief.json.
      additionalProperties: true
    PagedResponse:
      type: object
      required: [items, total, page]
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    PublishStatus:
      type: string
      enum: [draft, published]
